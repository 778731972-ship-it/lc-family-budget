<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>L-C family budget</title>
<style>
  :root{
    --bg:#f4f5f3;
    --card:#ffffff;
    --ink:#1b242c;
    --ink-2:#5b6672;
    --ink-3:#8d97a1;
    --line:#e5e8e5;
    --accent:#2f7d6e;
    --accent-dark:#276658;
    --accent-soft:#e7f2ee;
    --expense:#c1554b;
    --income:#2f8b5c;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,30,25,.04), 0 10px 26px -16px rgba(20,30,25,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(244,245,243,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;letter-spacing:.01em}
  .logo{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.03em;box-shadow:0 2px 6px rgba(47,125,110,.35)}
  .month-nav{margin-left:auto;display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
  .month-nav button{border:0;background:none;width:27px;height:27px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:15px;line-height:1;transition:.15s}
  .month-nav button:hover{background:var(--accent-soft);color:var(--accent)}
  .month-label{font-variant-numeric:tabular-nums;font-weight:640;min-width:92px;text-align:center;font-size:13.5px}

  /* ---------- layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  .card h2{font-size:13px;font-weight:650;margin:0 0 13px;display:flex;align-items:center;gap:8px;color:var(--ink)}
  .card h2 .sub{font-weight:400;color:var(--ink-3);font-size:11.5px;margin-left:auto;display:flex;align-items:center;gap:5px}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);min-width:0}
  .stat .k{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
  .stat .v{font-size:21px;font-weight:670;letter-spacing:-.015em;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .d{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .v.income{color:var(--income)}
  .v.expense{color:var(--expense)}
  .v.accent{color:var(--accent)}
  .up{color:var(--expense)}
  .down{color:var(--income)}
  .bar{height:4px;border-radius:99px;background:#eef0ed;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}

  /* ---------- entry bar ---------- */
  .entry{padding:11px 13px;margin-bottom:14px}
  .entry-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .entry .seg{margin-bottom:0;flex:0 0 auto;width:114px}
  .entry .amount-field{flex:1 1 150px;min-width:132px;padding:4px 11px}
  .entry .amount-field input{font-size:18px;padding:5px 0}
  .entry select{flex:1 1 118px;width:auto;min-width:106px}
  .entry input[type=date]{flex:0 1 150px;width:auto;min-width:140px}
  .entry #in-note{flex:2 1 170px;width:auto;min-width:140px}
  .entry #btnSave{flex:0 0 auto;width:auto;padding:9px 20px}
  .entry #btnCancel{flex:0 0 auto;width:auto;padding:9px 14px}
  .err{max-width:1180px;margin:10px auto 0;padding:10px 14px;border:1px solid #e7cdca;background:#fdf3f2;color:#a8443b;border-radius:10px;font-size:12.5px;line-height:1.6}

  /* ---------- people ---------- */
  .people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .person{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow);min-width:0}
  .person-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .person-head .nm{font-weight:650;font-size:13.5px}
  .person-head .tag{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .person-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}
  .person-grid .k{font-size:11px;color:var(--ink-3);margin-bottom:1px}
  .person-grid .v{font-size:14.5px;font-weight:640;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .person-grid .v.muted{color:var(--ink-2);font-weight:560}

  /* ---------- charts ---------- */
  .charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;margin-bottom:14px}
  .donut-wrap{display:flex;gap:18px;align-items:center}
  #donut{width:168px;height:168px;flex:0 0 auto}
  .legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;max-height:172px;overflow:auto}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
  .legend-row .dot{width:8px;height:8px;border-radius:2.5px;flex:0 0 auto}
  .legend-row .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend-row .pc{color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums}
  .legend-row .vl{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:620;padding-left:8px}
  .legend-empty{font-size:12.5px;color:var(--ink-3);line-height:1.9}
  #trend{width:100%;height:180px;display:block}

  /* ---------- main grid ---------- */
  .main{display:grid;grid-template-columns:minmax(0,1fr) 328px;gap:14px;align-items:start}
  .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:64px}

  /* ---------- form ---------- */
  .seg{display:flex;background:#eff1ee;border-radius:10px;padding:3px;gap:3px;margin-bottom:14px}
  .seg button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;font-size:13px;font-weight:620;color:var(--ink-2);cursor:pointer;transition:.16s}
  .seg button[aria-selected="true"]{background:#fff;box-shadow:0 1px 3px rgba(20,30,25,.12)}
  .seg button[data-type="expense"][aria-selected="true"]{color:var(--expense)}
  .seg button[data-type="income"][aria-selected="true"]{color:var(--income)}
  .field{margin-bottom:12px;min-width:0}
  .field > label{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:5px;font-weight:550}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  input[type=text],input[type=number],input[type=date],input[type=search],select{
    font-family:inherit;font-size:13px;color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;background:#fff;outline:none;width:100%;transition:.15s
  }
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  select{appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238d97a1' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:26px;cursor:pointer}
  .amount-field{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:11px;padding:6px 12px;background:#fcfdfc;transition:.15s}
  .amount-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
  .amount-field .cur{color:var(--ink-3);font-size:17px;font-weight:600}
  .amount-field input{border:0;background:none;outline:none;box-shadow:none!important;font-size:22px;font-weight:660;letter-spacing:-.01em;padding:4px 0;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:5px;align-items:center;transition:.14s;line-height:1.4}
  .chip:hover{border-color:#ccd4cf;background:#fafbfa}
  .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:#b9dbd1;color:#1e5c50;font-weight:620}

  .btn{font-size:13px;font-weight:620;border-radius:9px;padding:9px 14px;cursor:pointer;border:1px solid transparent;transition:.15s;white-space:nowrap}
  .btn.primary{background:var(--accent);color:#fff;width:100%;padding:10px}
  .btn.primary:hover{background:var(--accent-dark)}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}
  .btn.ghost:hover{background:#f7f8f6;color:var(--ink)}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
  .btn.danger{background:#fff;border-color:#e7cdca;color:var(--expense)}
  .btn.danger:hover{background:#fdf3f2}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap}
  .btn-row .btn{flex:1 1 auto;padding:7px 8px;font-size:12px;text-align:center}

  /* ---------- filters ---------- */
  .filters{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .filters select,.filters input{font-size:12.5px;padding:7px 9px}
  .filters select{padding-right:24px}

  /* ---------- list ---------- */
  .day-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-3);padding:12px 4px 5px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
  .day-head:first-child{padding-top:0}
  .day-head b{font-weight:600;color:var(--ink-2)}
  .rec{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid #f2f3f1}
  .rec:hover{background:#fbfcfb}
  .rec-icon{width:34px;height:34px;border-radius:10px;background:#f4f6f4;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .rec-main{min-width:0;flex:1}
  .rec-title{font-size:13.5px;font-weight:580;display:flex;align-items:center;gap:6px;min-width:0}
  .rec-title .note{font-weight:400;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .rec-meta{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px;margin-top:1px}
  .rec-meta .mdot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .rec-amt{font-variant-numeric:tabular-nums;font-weight:640;font-size:14px;white-space:nowrap}
  .rec-amt.expense{color:var(--expense)}
  .rec-amt.income{color:var(--income)}
  .rec-actions{display:flex;gap:2px;opacity:0;transition:.15s}
  .rec:hover .rec-actions,.rec:focus-within .rec-actions{opacity:1}
  .icon-btn{border:0;background:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--ink-3);transition:.14s}
  .icon-btn:hover{background:#eef1ee;color:var(--ink)}
  .icon-btn.del:hover{background:#fdeeed;color:var(--expense)}
  .empty{padding:34px 10px;text-align:center;color:var(--ink-3);font-size:13px}
  .empty p{margin:0 0 12px}

  /* ---------- members ---------- */
  .member-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
  .avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:650;flex:0 0 auto}
  .member-row .x{margin-left:auto}
  .member-add{display:flex;gap:6px;margin-top:8px}
  .hr{height:1px;background:var(--line);margin:14px 0}
  .foot{text-align:center;color:var(--ink-3);font-size:11.5px;margin:26px 0 0;line-height:1.7}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#222b31;color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.22s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- responsive ---------- */
  @media (max-width:980px){
    .main{grid-template-columns:1fr}
    .side{position:static;order:-1}
    .charts{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .people{grid-template-columns:1fr}
  }
  @media (max-width:560px){
    .wrap{padding:14px 13px 50px}
    .topbar-inner{padding:10px 13px}
    .month-nav{margin-left:0;order:3;flex:1 1 100%;justify-content:space-between}
    .month-label{flex:1}
    .stat .v{font-size:19px}
    .donut-wrap{flex-direction:column;align-items:stretch}
    #donut{align-self:center}
    .filters{grid-template-columns:1fr 1fr}
    .filters input{grid-column:1 / -1}
    .rec-actions{opacity:1}
    .entry .seg{width:100%}
    .entry .amount-field{flex:1 1 100%}
    .entry select{flex:1 1 calc(50% - 5px)}
    .entry input[type=date]{flex:1 1 calc(50% - 5px)}
    .entry #in-note{flex:1 1 100%}
    .entry #btnSave{flex:1 1 100%}
  }
</style>
</head>
<body>

<div id="errBar" class="err" style="display:none"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="logo">LC</span>L-C family budget</div>
    <div class="month-nav">
      <button id="btnPrevMonth" aria-label="上个月" title="上个月">‹</button>
      <span class="month-label" id="monthLabel">—</span>
      <button id="btnNextMonth" aria-label="下个月" title="下个月">›</button>
    </div>
    <button class="btn ghost sm" id="btnThisMonth">回到本月</button>
  </div>
</header>

<main class="wrap">
  
  <section class="card entry" id="entryCard">
    <form id="addForm" class="entry-form" autocomplete="off">
      <div class="seg" role="tablist" aria-label="收支类型">
        <button type="button" role="tab" data-type="expense" aria-selected="true">支出</button>
        <button type="button" role="tab" data-type="income" aria-selected="false">收入</button>
      </div>
      <div class="amount-field">
        <span class="cur">¥</span>
        <input id="in-amount" type="text" inputmode="decimal" placeholder="0.00" aria-label="金额" />
      </div>
      <select id="in-cat" aria-label="分类"></select>
      <select id="in-member" aria-label="成员"></select>
      <input id="in-date" type="date" aria-label="日期" />
      <input id="in-note" type="text" placeholder="备注（可选）" aria-label="备注" maxlength="60" />
      <button class="btn primary" id="btnSave" type="submit">保存</button>
      <button class="btn ghost" id="btnCancel" type="button" style="display:none">取消</button>
    </form>
  </section>

  <section class="stats" id="stats"></section>
  <section class="people" id="people"></section>

  <section class="charts">
    <div class="card">
      <h2>支出结构<span class="sub" id="donutSub"></span></h2>
      <div class="donut-wrap">
        <canvas id="donut" width="168" height="168" role="img" aria-label="本月支出分类占比"></canvas>
        <div class="legend" id="donutLegend"></div>
      </div>
    </div>
    <div class="card">
      <h2>近 6 个月趋势
        <span class="sub">
          <span class="dot" style="width:8px;height:8px;border-radius:2.5px;background:#c1554b;display:inline-block"></span>支出
          <span class="dot" style="width:8px;height:8px;border-radius:2.5px;background:#2f8b5c;display:inline-block;margin-left:8px"></span>收入
        </span>
      </h2>
      <canvas id="trend" height="180" role="img" aria-label="近六个月收支趋势"></canvas>
    </div>
  </section>

  <div class="main">
    <section class="card ledger">
      <h2>账单明细<span class="sub" id="listSub"></span></h2>
      <div class="filters">
        <input type="search" id="flt-q" placeholder="搜索备注 / 分类 / 成员" />
        <select id="flt-range">
          <option value="month">本月</option>
          <option value="3m">近 3 个月</option>
          <option value="year">今年</option>
          <option value="all">全部时间</option>
        </select>
        <select id="flt-type">
          <option value="">收支都看</option>
          <option value="expense">只看支出</option>
          <option value="income">只看收入</option>
        </select>
        <select id="flt-member"><option value="">全部成员</option></select>
      </div>
      <div id="listWrap"></div>
    </section>

    <aside class="side">
      <section class="card">
        <h2>预算与成员<span class="sub" id="budgetHint"></span></h2>
        <div class="field">
          <label for="in-budget">每月预算（元）</label>
          <input id="in-budget" type="number" min="0" step="100" placeholder="例如 6000" />
        </div>
        <div class="hr"></div>
        <div id="memberList"></div>
        <div class="member-add">
          <input id="newMember" type="text" placeholder="新增成员，如：lxy" maxlength="8" />
          <button class="btn ghost sm" id="btnAddMember" type="button">添加</button>
        </div>
        <div class="hr"></div>
        <div class="btn-row">
          <button class="btn ghost" id="btnExportCSV" type="button">导出 CSV</button>
          <button class="btn ghost" id="btnImportCSV" type="button">导入 CSV</button>
          <button class="btn ghost" id="btnBackup" type="button">备份 JSON</button>
        </div>
        <div class="btn-row" style="margin-top:6px">
          <button class="btn ghost" id="btnRestore" type="button">恢复备份</button>
          <button class="btn danger" id="btnClear" type="button">清空数据</button>
        </div>
        <input id="fileRestore" type="file" accept="application/json,.json" hidden />
        <input id="fileCSV" type="file" accept=".csv,text/csv" hidden />
      </section>
    </aside>
  </div>

  <p class="foot">数据只保存在这台设备的浏览器里，不会上传。<br />换电脑或清理浏览器数据前，请先用「备份 JSON」存一份。</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  window.onerror = function (msg, src, line) {
    var bar = document.getElementById('errBar');
    if (!bar) return;
    bar.style.display = 'block';
    bar.textContent = '页面脚本出错：' + msg + '（第 ' + line + ' 行）。把这段话发给我就能定位。';
  };

  var STORE_KEY = 'family-ledger.v1';

  var CATS = {
    expense: [
      { name: '五险一金', icon: '🛡️' },
      { name: '餐饮', icon: '🍜' }, { name: '买菜', icon: '🥬' }, { name: '交通', icon: '🚌' },
      { name: '住房', icon: '🏠' }, { name: '水电燃气', icon: '💡' }, { name: '日用', icon: '🧴' },
      { name: '医疗', icon: '💊' }, { name: '教育', icon: '📚' }, { name: '娱乐', icon: '🎮' },
      { name: '服饰', icon: '👕' }, { name: '人情礼往', icon: '🎁' }, { name: '宠物', icon: '🐾' },
      { name: '其他', icon: '📦' }
    ],
    income: [
      { name: '工资', icon: '💰' }, { name: '奖金', icon: '🏆' }, { name: '理财收益', icon: '📈' },
      { name: '兼职', icon: '💼' }, { name: '红包', icon: '🧧' }, { name: '报销', icon: '🧾' },
      { name: '其他', icon: '📦' }
    ]
  };

  var PALETTE = ['#2f7d6e', '#4a94a8', '#d0993f', '#c1554b', '#8a7cb8', '#77a06a', '#b07a5a', '#8d97a1'];
  var MEMBER_COLORS = ['#3f7fa8', '#c1718d', '#c99a3e', '#6c9a6a', '#8a7cb8', '#b0785f'];

  var DEFAULT_DATA = {
    v: 1,
    budget: 6000,
    members: [
      { name: 'lkk', color: MEMBER_COLORS[0] },
      { name: 'csm', color: MEMBER_COLORS[1] },
      { name: 'lyc', color: MEMBER_COLORS[2] }
    ],
    records: []
  };

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36); }
  function round2(n) { return Math.round(n * 100) / 100; }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function monthOf(dateStr) { return String(dateStr).slice(0, 7); }
  function shiftMonth(ym, delta) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + delta;
    var d = new Date(y, m, 1);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }
  function monthTitle(ym) { return ym.slice(0, 4) + '年' + (+ym.slice(5, 7)) + '月'; }
  function dayLabel(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    var w = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
    var suffix = dateStr === todayStr() ? ' · 今天' : '';
    return (+dateStr.slice(5, 7)) + '月' + (+dateStr.slice(8, 10)) + '日 ' + w + suffix;
  }
  function num(n) {
    return Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function yuan(n) { return '¥' + num(n); }
  function compact(n) {
    if (n >= 10000) return (n / 10000).toFixed(n >= 100000 ? 0 : 1) + '万';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return String(Math.round(n));
  }
  function catMeta(type, name) {
    var list = CATS[type] || [];
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    return { name: name || '其他', icon: type === 'income' ? '💰' : '📦' };
  }
  function escapeHTML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------------- 状态 ---------------- */
  var state = {
    data: null,
    month: todayStr().slice(0, 7),
    formType: 'expense',
    formCat: CATS.expense[0].name,
    editingId: null,
    filters: { q: '', range: 'month', type: '', member: '' }
  };

  function normalize(raw) {
    var d = JSON.parse(JSON.stringify(DEFAULT_DATA));
    if (raw && typeof raw === 'object') {
      if (Array.isArray(raw.members) && raw.members.length) {
        var ms = [];
        raw.members.forEach(function (m, i) {
          if (m && typeof m.name === 'string' && m.name.trim()) {
            ms.push({ name: m.name.trim().slice(0, 8), color: m.color || MEMBER_COLORS[i % MEMBER_COLORS.length] });
          }
        });
        if (ms.length) d.members = ms;
      }
      if (Number.isFinite(+raw.budget) && +raw.budget >= 0) d.budget = +raw.budget;
      if (Array.isArray(raw.records)) {
        var rs = [];
        raw.records.forEach(function (r) {
          if (!r || typeof r.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(r.date)) return;
          var amount = round2(Math.abs(+r.amount || 0));
          if (amount <= 0) return;
          rs.push({
            id: r.id || uid(),
            date: r.date,
            type: r.type === 'income' ? 'income' : 'expense',
            amount: amount,
            category: String(r.category || '其他').slice(0, 12),
            member: String(r.member || '').slice(0, 8),
            note: String(r.note || '').slice(0, 60),
            createdAt: Number(r.createdAt) || 0
          });
        });
        d.records = rs;
      }
    }
    return d;
  }

  var LEGACY_NAMES = ['爸爸', '妈妈', '宝宝'];
  var LEGACY_MAP = { '爸爸': 'lkk', '妈妈': 'csm', '宝宝': 'lyc' };

  /* 旧版默认成员（爸爸/妈妈/宝宝）自动换成 lkk/csm/lyc，已有账目不丢 */
  function migrateLegacyMembers() {
    var names = state.data.members.map(function (m) { return m.name; });
    if (names.length !== LEGACY_NAMES.length) return false;
    for (var i = 0; i < names.length; i++) if (names[i] !== LEGACY_NAMES[i]) return false;
    state.data.members = DEFAULT_DATA.members.map(function (m) {
      return { name: m.name, color: m.color };
    });
    state.data.records.forEach(function (r) {
      if (LEGACY_MAP[r.member]) r.member = LEGACY_MAP[r.member];
    });
    return true;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      state.data = normalize(raw ? JSON.parse(raw) : null);
    } catch (err) {
      state.data = normalize(null);
    }
    if (migrateLegacyMembers()) save();
  }

  var saveWarned = false;
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state.data));
    } catch (err) {
      if (!saveWarned) {
        saveWarned = true;
        toast('浏览器不允许本地存储，这次修改不会被保存');
      }
    }
  }

  /* ---------------- 统计 ---------------- */
  function recordsOfMonth(ym) {
    return state.data.records.filter(function (r) { return monthOf(r.date) === ym; });
  }
  function sumOf(recs, type) {
    return recs.reduce(function (s, r) { return r.type === type ? s + r.amount : s; }, 0);
  }
  function groupByCategory(recs) {
    var map = {};
    recs.forEach(function (r) {
      if (r.type !== 'expense') return;
      map[r.category] = (map[r.category] || 0) + r.amount;
    });
    return Object.keys(map).map(function (k) { return { name: k, value: map[k] }; })
      .sort(function (a, b) { return b.value - a.value; });
  }

  /* ---------------- 概览数字 ---------------- */
  function deltaText(cur, prev, upIsBad) {
    if (!prev) return prev === 0 && cur === 0 ? '暂无数据' : '上月无同类记录';
    var diff = ((cur - prev) / prev) * 100;
    if (Math.abs(diff) < 0.05) return '与上月基本持平';
    var up = diff > 0;
    var cls = up ? (upIsBad ? 'up' : 'down') : (upIsBad ? 'down' : 'up');
    return '较上月 <span class="' + cls + '">' + (up ? '↑' : '↓') + Math.abs(diff).toFixed(1) + '%</span>';
  }

  function sumInsurance(recs) {
    return recs.reduce(function (s, r) {
      return r.type === 'expense' && r.category === '五险一金' ? s + r.amount : s;
    }, 0);
  }

  function renderStats() {
    var ym = state.month;
    var recs = recordsOfMonth(ym);
    var inc = sumOf(recs, 'income');
    var exp = sumOf(recs, 'expense');
    var ins = sumInsurance(recs);
    var balance = inc - exp;

    var prevRecs = recordsOfMonth(shiftMonth(ym, -1));
    var prevBalance = sumOf(prevRecs, 'income') - sumOf(prevRecs, 'expense');
    var budget = state.data.budget || 0;
    var remain = budget - exp;
    var pct = budget > 0 ? Math.min(100, (exp / budget) * 100) : 0;
    var over = budget > 0 && exp > budget;

    $('#stats').innerHTML =
      '<div class="stat"><div class="k">家庭总收入</div>' +
        '<div class="v income">' + yuan(inc) + '</div>' +
        '<div class="d">' + deltaText(inc, sumOf(prevRecs, 'income'), false) + '</div></div>' +
      '<div class="stat"><div class="k">家庭总支出</div>' +
        '<div class="v expense">' + yuan(exp) + '</div>' +
        '<div class="d">其中五险一金 ' + yuan(ins) + ' · ' + recs.length + ' 笔</div></div>' +
      '<div class="stat"><div class="k">家庭结余</div>' +
        '<div class="v ' + (balance >= 0 ? 'accent' : 'expense') + '">' + yuan(balance) + '</div>' +
        '<div class="d">储蓄率 ' + (inc > 0 ? Math.round((balance / inc) * 100) + '%' : '—') +
          ' · 上月结余 ' + yuan(prevBalance) + '</div></div>' +
      '<div class="stat"><div class="k">家庭预算</div>' +
        '<div class="v ' + (over ? 'expense' : '') + '">' + (budget > 0 ? yuan(remain) : '未设置') + '</div>' +
        '<div class="d">' + (budget > 0
          ? '已用 ' + Math.round((exp / budget) * 100) + '% · 预算 ' + yuan(budget)
          : '在「预算与成员」里填写') + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%;background:' + (over ? 'var(--expense)' : 'var(--accent)') + '"></i></div></div>';
  }

  /* ---------------- 成员收支 ---------------- */
  function renderPeople() {
    var host = $('#people');
    if (!host) return;
    var recs = recordsOfMonth(state.month);
    host.innerHTML = state.data.members.map(function (m) {
      var mine = recs.filter(function (r) { return r.member === m.name; });
      var inc = sumOf(mine, 'income');
      var exp = sumOf(mine, 'expense');
      var ins = sumInsurance(mine);
      var bal = inc - exp;
      return '<div class="person">' +
        '<div class="person-head">' +
          '<span class="avatar" style="background:' + m.color + '">' +
            escapeHTML(m.name.slice(0, 1).toUpperCase()) + '</span>' +
          '<span class="nm">' + escapeHTML(m.name) + '</span>' +
          '<span class="tag">' + mine.length + ' 笔</span>' +
        '</div>' +
        '<div class="person-grid">' +
          '<div><div class="k">收入</div><div class="v income">' + yuan(inc) + '</div></div>' +
          '<div><div class="k">支出</div><div class="v expense">' + yuan(exp) + '</div></div>' +
          '<div><div class="k">其中五险一金</div><div class="v muted">' + yuan(ins) + '</div></div>' +
          '<div><div class="k">结余</div><div class="v ' + (bal >= 0 ? 'accent' : 'expense') + '">' + yuan(bal) + '</div></div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* ---------------- 环形图 ---------------- */
  var FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';

  function fitCanvas(cv) {
    var dpr = window.devicePixelRatio || 1;
    var rect = cv.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width));
    var h = Math.max(1, Math.round(rect.height));
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { ctx: ctx, w: w, h: h };
  }

  function renderDonut() {
    var cv = $('#donut');
    if (!cv) return;
    var fit = fitCanvas(cv);
    var ctx = fit.ctx, w = fit.w, h = fit.h;

    var groups = groupByCategory(recordsOfMonth(state.month));
    var total = groups.reduce(function (s, g) { return s + g.value; }, 0);

    var shown = groups;
    if (groups.length > 7) {
      var head = groups.slice(0, 6);
      var rest = groups.slice(6).reduce(function (s, g) { return s + g.value; }, 0);
      shown = head.concat([{ name: '其他类别', value: rest }]);
    }

    var cx = w / 2, cy = h / 2;
    var radius = Math.min(w, h) / 2 - 6;
    var thick = Math.max(14, radius * 0.30);
    var R = radius - thick / 2;

    if (total <= 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.lineWidth = thick;
      ctx.strokeStyle = '#eef0ed';
      ctx.stroke();
    } else {
      var gap = shown.length > 1 ? 0.024 : 0;
      var a = -Math.PI / 2;
      shown.forEach(function (g, i) {
        var ang = (g.value / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(cx, cy, R, a + gap / 2, a + ang - gap / 2);
        ctx.lineWidth = thick;
        ctx.strokeStyle = PALETTE[i % PALETTE.length];
        ctx.stroke();
        a += ang;
      });
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#8d97a1';
    ctx.font = '11px ' + FONT;
    ctx.fillText(total > 0 ? '本月支出' : '暂无支出', cx, cy - 12);
    ctx.fillStyle = '#1b242c';
    ctx.font = '600 16px ' + FONT;
    ctx.fillText(total > 0 ? '¥' + compact(total) : '—', cx, cy + 7);

    var legend = $('#donutLegend');
    if (!total) {
      legend.innerHTML = '<div class="legend-empty">这个月还没有支出记录。<br />在「记一笔」里开始吧。</div>';
    } else {
      legend.innerHTML = shown.map(function (g, i) {
        var p = (g.value / total) * 100;
        return '<div class="legend-row">' +
          '<span class="dot" style="background:' + PALETTE[i % PALETTE.length] + '"></span>' +
          '<span class="nm">' + catMeta('expense', g.name).icon + ' ' + escapeHTML(g.name) + '</span>' +
          '<span class="pc">' + p.toFixed(0) + '%</span>' +
          '<span class="vl">' + yuan(g.value) + '</span></div>';
      }).join('');
    }
    $('#donutSub').textContent = total > 0 ? shown.length + ' 个分类' : '';
  }

  /* ---------------- 趋势图 ---------------- */
  function roundRect(ctx, x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  function niceCeil(v) {
    var exp = Math.floor(Math.log10(v));
    var base = Math.pow(10, exp);
    var n = v / base;
    var step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return step * base;
  }

  function renderTrend() {
    var cv = $('#trend');
    if (!cv) return;
    var fit = fitCanvas(cv);
    var ctx = fit.ctx, w = fit.w, h = fit.h;

    var data = [];
    for (var i = 5; i >= 0; i--) {
      var m = shiftMonth(state.month, -i);
      var recs = recordsOfMonth(m);
      data.push({ m: m, inc: sumOf(recs, 'income'), exp: sumOf(recs, 'expense') });
    }

    var padL = 42, padR = 8, padT = 12, padB = 24;
    var plotW = w - padL - padR;
    var plotH = h - padT - padB;
    var maxVal = 1;
    data.forEach(function (d) { maxVal = Math.max(maxVal, d.inc, d.exp); });
    var nice = niceCeil(maxVal);

    ctx.font = '10px ' + FONT;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (var k = 0; k <= 4; k++) {
      var v = (nice / 4) * k;
      var y = padT + plotH - (v / nice) * plotH;
      ctx.beginPath();
      ctx.moveTo(padL, y + 0.5);
      ctx.lineTo(w - padR, y + 0.5);
      ctx.strokeStyle = k === 0 ? '#dfe3df' : '#f0f2f0';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#9aa3ac';
      ctx.fillText(compact(v), padL - 8, y);
    }

    var slot = plotW / 6;
    var barW = Math.max(6, Math.min(13, slot * 0.24));
    var gap = 3;

    data.forEach(function (d, idx) {
      var cx = padL + slot * idx + slot / 2;
      var isCur = d.m === state.month;
      if (d.exp > 0) {
        var bh1 = Math.max(2, (d.exp / nice) * plotH);
        ctx.fillStyle = '#c1554b';
        roundRect(ctx, cx - barW - gap / 2, padT + plotH - bh1, barW, bh1, Math.min(3, barW / 2));
        ctx.fill();
      }
      if (d.inc > 0) {
        var bh2 = Math.max(2, (d.inc / nice) * plotH);
        ctx.fillStyle = '#2f8b5c';
        roundRect(ctx, cx + gap / 2, padT + plotH - bh2, barW, bh2, Math.min(3, barW / 2));
        ctx.fill();
      }
      ctx.fillStyle = isCur ? '#1b242c' : '#9aa3ac';
      ctx.font = (isCur ? '600 ' : '') + '10.5px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText((+d.m.slice(5, 7)) + '月', cx, h - padB + 7);
    });
  }

  /* ---------------- 明细列表 ---------------- */
  function filteredRecords() {
    var f = state.filters;
    var recs = state.data.records.slice();

    if (f.range === 'month') {
      recs = recs.filter(function (r) { return monthOf(r.date) === state.month; });
    } else if (f.range === '3m') {
      var set = {};
      for (var i = 0; i < 3; i++) set[shiftMonth(state.month, -i)] = 1;
      recs = recs.filter(function (r) { return set[monthOf(r.date)]; });
    } else if (f.range === 'year') {
      var y = state.month.slice(0, 4);
      recs = recs.filter(function (r) { return r.date.slice(0, 4) === y; });
    }

    if (f.type) recs = recs.filter(function (r) { return r.type === f.type; });
    if (f.member) recs = recs.filter(function (r) { return r.member === f.member; });
    if (f.q) {
      var q = f.q.toLowerCase();
      recs = recs.filter(function (r) {
        return (r.note || '').toLowerCase().indexOf(q) >= 0 ||
          r.category.toLowerCase().indexOf(q) >= 0 ||
          (r.member || '').toLowerCase().indexOf(q) >= 0;
      });
    }

    recs.sort(function (a, b) {
      if (a.date === b.date) return (b.createdAt || 0) - (a.createdAt || 0);
      return a.date < b.date ? 1 : -1;
    });
    return recs;
  }

  function memberColor(name) {
    for (var i = 0; i < state.data.members.length; i++) {
      if (state.data.members[i].name === name) return state.data.members[i].color;
    }
    return '#99a2ab';
  }

  function recordHTML(r) {
    var meta = catMeta(r.type, r.category);
    var sign = r.type === 'income' ? '+' : '−';
    return '<div class="rec" data-id="' + r.id + '">' +
      '<div class="rec-icon">' + meta.icon + '</div>' +
      '<div class="rec-main">' +
        '<div class="rec-title">' + escapeHTML(r.category) +
          (r.note ? '<span class="note">· ' + escapeHTML(r.note) + '</span>' : '') + '</div>' +
        '<div class="rec-meta">' +
          (r.member
            ? '<span class="mdot" style="background:' + memberColor(r.member) + '"></span>' + escapeHTML(r.member)
            : '未指定成员') + '</div>' +
      '</div>' +
      '<div class="rec-amt ' + r.type + '">' + sign + yuan(r.amount).slice(1) + '</div>' +
      '<div class="rec-actions">' +
        '<button class="icon-btn" data-action="edit" title="编辑" aria-label="编辑">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>' +
        '<button class="icon-btn del" data-action="del" title="删除" aria-label="删除">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>' +
      '</div></div>';
  }

  function renderList() {
    var recs = filteredRecords();
    $('#listSub').textContent = recs.length
      ? recs.length + ' 笔 · 支出 ' + yuan(sumOf(recs, 'expense')) + ' · 收入 ' + yuan(sumOf(recs, 'income'))
      : '';

    var wrap = $('#listWrap');
    if (!recs.length) {
      var hasAny = state.data.records.length > 0;
      wrap.innerHTML = '<div class="empty"><p>' +
        (hasAny ? '没有符合条件的记录，试试调整筛选条件。' : '还没有账单。先记第一笔，或加载一份示例数据看看效果。') +
        '</p>' + (hasAny ? '' : '<button class="btn ghost sm" data-action="sample" type="button">加载示例数据</button>') +
        '</div>';
      return;
    }

    var days = [];
    var byDay = {};
    recs.forEach(function (r) {
      if (!byDay[r.date]) { byDay[r.date] = []; days.push(r.date); }
      byDay[r.date].push(r);
    });

    wrap.innerHTML = days.map(function (day) {
      var list = byDay[day];
      var parts = [];
      if (sumOf(list, 'expense')) parts.push('支出 ' + yuan(sumOf(list, 'expense')));
      if (sumOf(list, 'income')) parts.push('收入 ' + yuan(sumOf(list, 'income')));
      return '<div class="day-head"><b>' + dayLabel(day) + '</b><span>' + parts.join(' · ') + '</span></div>' +
        list.map(recordHTML).join('');
    }).join('');
  }

  /* ---------------- 表单与成员 ---------------- */
  function renderForm() {
    $$('.seg button').forEach(function (b) {
      b.setAttribute('aria-selected', String(b.dataset.type === state.formType));
    });

    var cats = CATS[state.formType];
    var has = cats.some(function (c) { return c.name === state.formCat; });
    if (!has) state.formCat = cats[0].name;
    var catSel = $('#in-cat');
    catSel.innerHTML = cats.map(function (c) {
      return '<option value="' + escapeHTML(c.name) + '">' + c.icon + ' ' + escapeHTML(c.name) + '</option>';
    }).join('');
    catSel.value = state.formCat;

    var sel = $('#in-member');
    var current = sel.value;
    sel.innerHTML = state.data.members.length
      ? state.data.members.map(function (m) {
          return '<option value="' + escapeHTML(m.name) + '">' + escapeHTML(m.name) + '</option>';
        }).join('')
      : '<option value="">未指定</option>';
    var stillThere = state.data.members.some(function (m) { return m.name === current; });
    if (stillThere) sel.value = current;

    $('#btnSave').textContent = state.editingId ? '保存修改' : '保存';
    $('#btnCancel').style.display = state.editingId ? 'block' : 'none';
  }

  function renderMembers() {
    $('#memberList').innerHTML = state.data.members.map(function (m) {
      return '<div class="member-row">' +
        '<span class="avatar" style="background:' + m.color + '">' + escapeHTML(m.name.slice(0, 1)) + '</span>' +
        '<span>' + escapeHTML(m.name) + '</span>' +
        '<button class="icon-btn del x" data-action="del-member" data-name="' + escapeHTML(m.name) +
          '" title="移除成员" aria-label="移除成员">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>' +
        '</div>';
    }).join('');

    var flt = $('#flt-member');
    var cur = flt.value;
    flt.innerHTML = '<option value="">全部成员</option>' + state.data.members.map(function (m) {
      return '<option value="' + escapeHTML(m.name) + '">' + escapeHTML(m.name) + '</option>';
    }).join('');
    var ok = state.data.members.some(function (m) { return m.name === cur; });
    flt.value = ok ? cur : '';

    $('#in-budget').value = state.data.budget || '';
    $('#budgetHint').textContent = state.data.budget ? '每月 ' + yuan(state.data.budget) : '未设置';
  }

  function renderAll() {
    $('#monthLabel').textContent = monthTitle(state.month);
    renderStats();
    renderPeople();
    renderDonut();
    renderTrend();
    renderList();
    renderForm();
    renderMembers();
  }

  /* ---------------- 月份导航 ---------------- */
  $('#btnPrevMonth').addEventListener('click', function () {
    state.month = shiftMonth(state.month, -1);
    renderAll();
  });
  $('#btnNextMonth').addEventListener('click', function () {
    state.month = shiftMonth(state.month, 1);
    renderAll();
  });
  $('#btnThisMonth').addEventListener('click', function () {
    state.month = todayStr().slice(0, 7);
    renderAll();
  });

  /* ---------------- 表单交互 ---------------- */
  $$('.seg button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.formType = btn.dataset.type;
      state.formCat = CATS[state.formType][0].name;
      renderForm();
    });
  });

  $('#in-cat').addEventListener('change', function (e) {
    state.formCat = e.target.value;
  });

  function cleanAmount(v) {
    return String(v == null ? '' : v)
      .replace(/[０-９．]/g, function (c) {
        return c === '．' ? '.' : String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
      })
      .replace(/[^\d.]/g, '')
      .replace(/(\..*)\./g, '$1')
      .slice(0, 12);
  }
  $('#in-amount').addEventListener('input', function (e) {
    var cleaned = cleanAmount(e.target.value);
    if (cleaned !== e.target.value) e.target.value = cleaned;
  });
  $('#in-amount').addEventListener('blur', function (e) {
    var v = parseFloat(e.target.value);
    if (isFinite(v) && v > 0) e.target.value = (Math.round(v * 100) / 100).toString();
  });

  /* 回车直接保存（部分浏览器/输入法不会触发表单隐式提交） */
  $('#addForm').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.keyCode !== 13) return;
    var t = e.target;
    if (t && (t.tagName === 'BUTTON' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    try {
      submitRecord();
    } catch (err) {
      toast('保存失败：' + err.message);
    }
  });

  $('#addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    try {
      submitRecord();
    } catch (err) {
      toast('保存失败：' + err.message);
    }
  });

  function submitRecord() {
    var amount = parseFloat(cleanAmount($('#in-amount').value));
    if (!isFinite(amount) || amount <= 0) {
      toast('请输入大于 0 的金额');
      $('#in-amount').focus();
      return;
    }
    var date = $('#in-date').value || todayStr();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('请选择日期'); return; }

    var payload = {
      date: date,
      type: state.formType,
      amount: round2(amount),
      category: $('#in-cat').value || state.formCat,
      member: $('#in-member').value || '',
      note: $('#in-note').value.trim().slice(0, 60)
    };

    if (state.editingId) {
      var rec = null;
      state.data.records.forEach(function (r) { if (r.id === state.editingId) rec = r; });
      if (rec) Object.assign(rec, payload);
      state.editingId = null;
      toast('已更新');
    } else {
      state.data.records.push(Object.assign({ id: uid(), createdAt: Date.now() }, payload));
      toast('已记账 · ' + (payload.type === 'income' ? '+' : '−') + '¥' + num(payload.amount));
    }

    save();
    state.month = monthOf(payload.date);
    resetForm();
    renderAll();
    if (window.matchMedia && window.matchMedia('(min-width:900px)').matches) $('#in-amount').focus();
  }

  function resetForm() {
    $('#in-amount').value = '';
    $('#in-note').value = '';
    $('#in-date').value = todayStr();
    state.editingId = null;
    renderForm();
  }

  $('#btnCancel').addEventListener('click', function () {
    resetForm();
    toast('已取消编辑');
  });

  function startEdit(id) {
    var rec = null;
    state.data.records.forEach(function (r) { if (r.id === id) rec = r; });
    if (!rec) return;
    state.editingId = id;
    state.formType = rec.type;
    state.formCat = rec.category;
    renderForm();
    $('#in-amount').value = rec.amount;
    $('#in-date').value = rec.date;
    $('#in-note').value = rec.note || '';
    var okMember = state.data.members.some(function (m) { return m.name === rec.member; });
    if (okMember) $('#in-member').value = rec.member;
    var card = $('#entryCard');
    if (card && card.scrollIntoView) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    $('#in-amount').focus();
    $('#in-amount').select();
  }

  /* ---------------- 列表操作 ---------------- */
  $('#listWrap').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (btn && btn.dataset.action === 'sample') { seedSample(); return; }

    var row = e.target.closest('.rec');
    if (!row) return;
    var id = row.dataset.id;

    if (btn && btn.dataset.action === 'edit') { startEdit(id); return; }

    if (btn && btn.dataset.action === 'del') {
      var rec = null;
      state.data.records.forEach(function (r) { if (r.id === id) rec = r; });
      if (!rec) return;
      var msg = '删除这笔记录？\n\n' + rec.date + ' · ' + rec.category + ' · ¥' + num(rec.amount) +
        (rec.note ? '\n' + rec.note : '');
      if (!window.confirm(msg)) return;
      state.data.records = state.data.records.filter(function (r) { return r.id !== id; });
      if (state.editingId === id) resetForm();
      save();
      renderAll();
      toast('已删除');
    }
  });

  /* ---------------- 筛选 ---------------- */
  var searchTimer = 0;
  $('#flt-q').addEventListener('input', function (e) {
    clearTimeout(searchTimer);
    var v = e.target.value;
    searchTimer = setTimeout(function () {
      state.filters.q = v.trim();
      renderList();
    }, 140);
  });
  $('#flt-range').addEventListener('change', function (e) {
    state.filters.range = e.target.value;
    renderList();
  });
  $('#flt-type').addEventListener('change', function (e) {
    state.filters.type = e.target.value;
    renderList();
  });
  $('#flt-member').addEventListener('change', function (e) {
    state.filters.member = e.target.value;
    renderList();
  });

  /* ---------------- 预算与成员 ---------------- */
  $('#in-budget').addEventListener('change', function (e) {
    var v = parseFloat(e.target.value);
    state.data.budget = isFinite(v) && v >= 0 ? round2(v) : 0;
    save();
    renderStats();
    $('#budgetHint').textContent = state.data.budget ? '每月 ' + yuan(state.data.budget) : '未设置';
    toast(state.data.budget ? '预算已设为 ' + yuan(state.data.budget) : '已清空预算');
  });

  $('#btnAddMember').addEventListener('click', addMember);
  $('#newMember').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addMember(); }
  });

  function addMember() {
    var input = $('#newMember');
    var name = input.value.trim().slice(0, 8);
    if (!name) { toast('请输入成员名字'); input.focus(); return; }
    var exists = state.data.members.some(function (m) { return m.name === name; });
    if (exists) { toast('这个成员已经有了'); return; }

    var used = state.data.members.map(function (m) { return m.color; });
    var color = null;
    for (var i = 0; i < MEMBER_COLORS.length; i++) {
      if (used.indexOf(MEMBER_COLORS[i]) < 0) { color = MEMBER_COLORS[i]; break; }
    }
    if (!color) color = MEMBER_COLORS[state.data.members.length % MEMBER_COLORS.length];

    state.data.members.push({ name: name, color: color });
    input.value = '';
    save();
    renderMembers();
    renderForm();
    renderList();
    toast('已添加成员：' + name);
  }

  $('#memberList').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-action="del-member"]') : null;
    if (!btn) return;
    var name = btn.dataset.name;
    if (state.data.members.length <= 1) { toast('至少保留一位成员'); return; }
    var used = state.data.records.filter(function (r) { return r.member === name; }).length;
    var msg = '移除成员「' + name + '」？' + (used ? '\n\n该成员已有的 ' + used + ' 笔记录会保留，但不再显示成员名。' : '');
    if (!window.confirm(msg)) return;
    state.data.members = state.data.members.filter(function (m) { return m.name !== name; });
    save();
    renderAll();
    toast('已移除成员');
  });

  /* ---------------- 数据导出与备份 ---------------- */
  function download(content, filename, mime) {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function exportCSV() {
    var recs = state.data.records.slice().sort(function (a, b) {
      if (a.date === b.date) return (a.createdAt || 0) - (b.createdAt || 0);
      return a.date < b.date ? -1 : 1;
    });
    if (!recs.length) { toast('还没有可导出的记录'); return; }
    var rows = [['日期', '类型', '分类', '金额', '成员', '备注']];
    recs.forEach(function (r) {
      rows.push([r.date, r.type === 'income' ? '收入' : '支出', r.category, r.amount.toFixed(2), r.member, r.note]);
    });
    var csv = '\ufeff' + rows.map(function (row) {
      return row.map(function (c) {
        return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"';
      }).join(',');
    }).join('\r\n');
    download(csv, '家庭账单_' + todayStr() + '.csv', 'text/csv;charset=utf-8');
    toast('已导出 ' + recs.length + ' 笔记录');
  }

  $('#btnExportCSV').addEventListener('click', exportCSV);

  /* ---------------- CSV 导入 ---------------- */
  function parseCSV(text) {
    var rows = [], row = [], cell = '', quoted = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (quoted) {
        if (ch === '"') {
          if (text.charAt(i + 1) === '"') { cell += '"'; i++; }
          else quoted = false;
        } else cell += ch;
      } else if (ch === '"') {
        quoted = true;
      } else if (ch === ',') {
        row.push(cell); cell = '';
      } else if (ch === '\n') {
        row.push(cell); rows.push(row); row = []; cell = '';
      } else if (ch !== '\r') {
        cell += ch;
      }
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) {
      return r.some(function (c) { return String(c).trim() !== ''; });
    });
  }

  function normalizeDate(v) {
    var t = String(v == null ? '' : v).trim()
      .replace(/[年月]/g, '-').replace(/日/g, '').replace(/[.\/]/g, '-');
    if (/^\d{8}$/.test(t)) t = t.slice(0, 4) + '-' + t.slice(4, 6) + '-' + t.slice(6, 8);
    var m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!m) return '';
    return m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]);
  }

  function ensureMember(name) {
    if (!name) return;
    var exists = state.data.members.some(function (m) { return m.name === name; });
    if (exists) return;
    state.data.members.push({
      name: name,
      color: MEMBER_COLORS[state.data.members.length % MEMBER_COLORS.length]
    });
  }

  $('#btnImportCSV').addEventListener('click', function () { $('#fileCSV').click(); });

  $('#fileCSV').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || '').replace(/^\ufeff/, '');
      var rows = parseCSV(text);
      if (!rows.length) { toast('文件是空的'); return; }
      if (/日期|date/i.test(rows[0][0] || '')) rows.shift();

      var added = 0, skipped = 0;
      rows.forEach(function (c) {
        if (!c || c.length < 2) { skipped++; return; }
        var date = normalizeDate(c[0]);
        var amount = parseFloat(cleanAmount(c[3] !== undefined ? c[3] : c[2]));
        if (!date || !isFinite(amount) || amount <= 0) { skipped++; return; }
        var type = /收入|income|^in$/i.test(String(c[1] || '').trim()) ? 'income' : 'expense';
        var member = String(c[4] || '').trim().slice(0, 8);
        ensureMember(member);
        state.data.records.push({
          id: uid(),
          createdAt: Date.now() + added,
          date: date,
          type: type,
          amount: round2(Math.abs(amount)),
          category: String(c[2] || '其他').trim().slice(0, 12) || '其他',
          member: member,
          note: String(c[5] || '').trim().slice(0, 60)
        });
        added++;
      });

      if (!added) { toast('没识别到有效行，格式应为：日期,类型,分类,金额,成员,备注'); return; }
      save();
      renderAll();
      toast('已导入 ' + added + ' 笔' + (skipped ? '，跳过 ' + skipped + ' 行' : ''));
    };
    reader.readAsText(file);
  });

  $('#btnBackup').addEventListener('click', function () {
    var payload = JSON.stringify({ v: 1, exportedAt: new Date().toISOString(), data: state.data }, null, 2);
    download(payload, '家庭记账备份_' + todayStr() + '.json', 'application/json;charset=utf-8');
    toast('备份文件已下载');
  });

  $('#btnRestore').addEventListener('click', function () { $('#fileRestore').click(); });

  $('#fileRestore').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (err) {
        toast('这个文件不是有效的备份');
        return;
      }
      var raw = parsed && parsed.data ? parsed.data : parsed;
      if (!raw || !Array.isArray(raw.records)) { toast('这个文件不是有效的备份'); return; }
      if (!window.confirm('恢复备份会覆盖当前 ' + state.data.records.length + ' 笔记录，确定继续？')) return;
      state.data = normalize(raw);
      save();
      resetForm();
      renderAll();
      toast('已恢复 ' + state.data.records.length + ' 笔记录');
    };
    reader.readAsText(file);
  });

  $('#btnClear').addEventListener('click', function () {
    if (!state.data.records.length) { toast('目前没有记录'); return; }
    if (!window.confirm('清空全部 ' + state.data.records.length + ' 笔记录？此操作不可撤销，建议先备份。')) return;
    if (!window.confirm('再确认一次：真的清空所有账单数据吗？')) return;
    state.data.records = [];
    save();
    resetForm();
    renderAll();
    toast('数据已清空');
  });

  /* ---------------- 示例数据 ---------------- */
  function seedSample() {
    var ym = state.month;
    var isCurrent = ym === todayStr().slice(0, 7);
    var maxDay = isCurrent ? new Date().getDate() : 28;
    var names = state.data.members.map(function (m) { return m.name; });
    var pick = function (i) { return names[i % names.length] || ''; };

    var plan = [
      [1, 'expense', '住房', 3200, '房租'],
      [2, 'income', '工资', 12800, '本月工资'],
      [3, 'expense', '买菜', 216.8, '周末超市'],
      [4, 'expense', '餐饮', 68, '工作日午饭'],
      [6, 'expense', '交通', 120, '地铁月票'],
      [7, 'expense', '水电燃气', 342.5, '水电费'],
      [9, 'expense', '日用', 89.9, '纸巾洗衣液'],
      [11, 'expense', '餐饮', 258, '家庭聚餐'],
      [13, 'expense', '教育', 480, '绘本和练习册'],
      [15, 'income', '红包', 800, '长辈给的红包'],
      [16, 'expense', '医疗', 156.4, '感冒买药'],
      [18, 'expense', '娱乐', 99, '周末电影'],
      [20, 'expense', '服饰', 369, '换季衣服'],
      [22, 'expense', '买菜', 178.6, '菜市场'],
      [24, 'expense', '人情礼往', 600, '同事婚礼'],
      [26, 'expense', '宠物', 145, '猫粮'],
      [28, 'expense', '餐饮', 45, '早餐']
    ];

    // 按人固定的工资与五险一金
    var perPerson = [
      [2, 'income', '工资', 16000, '每月工资', 0],
      [2, 'expense', '五险一金', 2800, '社保公积金', 0],
      [21, 'income', '工资', 13000, '每月工资', 1],
      [21, 'expense', '五险一金', 2300, '社保公积金', 1],
      [25, 'income', '兼职', 1500, '周末兼职', 2]
    ];

    var added = 0;
    plan.forEach(function (p, i) {
      if (p[0] > maxDay) return;
      state.data.records.push({
        id: uid() + i,
        createdAt: Date.now() - i * 1000,
        date: ym + '-' + pad2(p[0]),
        type: p[1],
        category: p[2],
        amount: round2(p[3]),
        member: pick(i),
        note: p[4]
      });
      added++;
    });

    perPerson.forEach(function (p, i) {
      if (p[0] > maxDay) return;
      state.data.records.push({
        id: uid() + 'p' + i,
        createdAt: Date.now() - added * 1000,
        date: ym + '-' + pad2(p[0]),
        type: p[1],
        category: p[2],
        amount: round2(p[3]),
        member: names[p[5]] || '',
        note: p[4]
      });
      added++;
    });

    save();
    renderAll();
    toast('已加载 ' + added + ' 笔示例数据，可随时删除或清空');
  }

  /* ---------------- 提示 ---------------- */
  var toastTimer = 0;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  /* ---------------- 启动 ---------------- */
  load();
  $('#in-date').value = todayStr();
  renderAll();
  if (window.matchMedia && window.matchMedia('(min-width:900px)').matches) {
    $('#in-amount').focus();
  }

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      renderDonut();
      renderTrend();
    }, 120);
  });
})();
</script>
